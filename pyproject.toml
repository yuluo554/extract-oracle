[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "extract-oracle"
description = "归档提取预言机：只读归档字节，预言各提取器会写出什么名字、谁覆盖谁、谁被拒绝"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639：SPDX 表达式字符串（TOML 表写法已被 setuptools 弃用，硬期限 2027-02-18）
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["zip", "archive", "unicode", "filename", "ntfs", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving",
]
# 版本单一真源 = src/extract_oracle/__init__.py 的 __version__（勿在此写死第二份）。
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
# 3.12 起 TOML 解析器在标准库里，旧的条件依赖（`python_version < '3.11'` 才装的那个）永不成立 → 已删除。
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.scripts]
extract-oracle = "extract_oracle.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/extract-oracle"

[tool.setuptools.dynamic]
version = { attr = "extract_oracle.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
