name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  gate:
    name: layout-and-desensitize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sprint layout gate
        run: python tools/check_sprint_layout.py
      - name: Desensitization gate
        run: python tools/check_desensitized.py
      - name: Layout gate selftest
        run: python tools/check_sprint_layout.py --selftest

  test:
    name: test-py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Fixture regeneration check
        run: python tools/gen_fixtures.py --check
      # 三工具行为断言（tests/test_tool_behaviour.py）需要 unzip 与 7-Zip。
      # 缺工具时**不许 skip 成假绿**：装齐后设 ORACLE_REQUIRE_TOOLS=1，缺失即失败。
      - name: Install archive tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip p7zip-full libarchive-tools
      - name: Install archive tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install p7zip
          # unzip 与 bsdtar 随 macOS 自带；缺任一则下面的断言会明确失败
      - name: Install archive tools (Windows)
        if: runner.os == 'Windows'
        run: |
          # Windows runner 自带 bsdtar（System32\tar.exe）；7-Zip 与 unzip 需要显式装。
          choco install -y 7zip
          echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH
          # Info-ZIP unzip 在 Windows runner 上由 Git for Windows 提供
          echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - name: Pytest
        env:
          ORACLE_REQUIRE_TOOLS: "1"
        run: python -m pytest
      - name: Console script smoke
        run: |
          extract-oracle --version
          extract-oracle capabilities
          extract-oracle inspect data/fixtures/clean.zip --format json
      - name: Structure findings smoke
        # 判定层的交付态冒烟：六个结构样本各命中一条（退出码 1），`clean.zip` 零 finding（退出码 0）。
        # 退出码是口径（`data/README.md` §4.1），所以这里显式断言它，不用 `|| true` 吞掉。
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for pair in \
            "mismatch_name.zip structure.NAME_DIVERGES" \
            "alias_lfh.zip structure.FLAG_DIVERGES" \
            "overlap.zip structure.LFH_OVERLAP" \
            "wrong_count.zip structure.CD_COUNT_MISMATCH" \
            "crc_diverge.zip structure.CRC_DIVERGES" \
            "size_diverge.zip structure.SIZE_DIVERGES"
          do
            set -- $pair
            fixture=$1
            rule=$2
            out=$(extract-oracle check "data/fixtures/$fixture" --target windows --module structure)
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "FAIL $fixture: 期望退出码 1，实得 $rc"; fail=1
            fi
            echo "$out" | grep -q "\"$rule\"" || { echo "FAIL $fixture: 缺 $rule"; fail=1; }
          done
          extract-oracle check data/fixtures/clean.zip --target windows --module structure > /dev/null
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "FAIL clean.zip: 期望退出码 0（零误报基线），实得 $rc"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "structure smoke OK"
      - name: Fold findings smoke
        # MOD-3 的交付态冒烟：四份折叠样本在**指定平台**上各命中一条（退出码 1）；
        # 反向两条：`case.zip` 在 macos/linux 上必须零冲突（退 0）。
        # 退出码是口径（`data/README.md` §4.1），所以这里显式断言它，不用 `|| true` 吞掉。
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for triple in \
            "case.zip windows collision.CASEFOLD" \
            "norm.zip macos collision.NFC" \
            "trim.zip windows collision.TRIM" \
            "filedir.zip windows collision.FILEDIR"
          do
            set -- $triple
            fixture=$1
            target=$2
            code=$3
            out=$(extract-oracle check "data/fixtures/$fixture" --target "$target" --module fold)
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "FAIL $fixture/$target: 期望退出码 1，实得 $rc"; fail=1
            fi
            echo "$out" | grep -q "\"$code\"" || { echo "FAIL $fixture/$target: 缺 $code"; fail=1; }
          done
          # 反向：`case.zip` 在 macos/linux 上无 CASEFOLD（macOS 不近似、Linux 不折叠）
          for target in macos linux; do
            extract-oracle check data/fixtures/case.zip --target "$target" --module fold > /dev/null
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "FAIL case.zip/$target: 期望退出码 0（无冲突），实得 $rc"; fail=1
            fi
          done
          # 平台表接入的自证：真校验必须过（表被换过 → 非 0）
          extract-oracle platforms --verify > /dev/null
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "FAIL platforms --verify: 期望 0，实得 $rc"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "fold smoke OK"
      - name: Accessibility smoke
        # MOD-4 的交付态冒烟：四份样本各命中期望级别（退出码 1）；三条反向：
        # `clean.zip` 三平台零异常（退 0）、`long_comp.zip` 不得判成截断、`CON.txt` 三证据齐。
        # 退出码是口径（`data/README.md` §4.1），所以这里显式断言它，不用 `|| true` 吞掉。
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for pair in \
            "reserved.zip windows WRITTEN_UNREADABLE" \
            "trailing.zip windows WRITTEN_TRUNCATED" \
            "trim.zip windows WRITTEN_TRUNCATED" \
            "long_comp.zip windows BLOCKED"
          do
            set -- $pair
            fixture=$1
            target=$2
            level=$3
            out=$(extract-oracle check "data/fixtures/$fixture" --target "$target" --module accessibility)
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "FAIL $fixture/$target: 期望退出码 1，实得 $rc"; fail=1
            fi
            echo "$out" | grep -q "\"$level\"" || { echo "FAIL $fixture/$target: 缺 $level"; fail=1; }
          done
          # `CON.txt` 的三条实测证据必须齐（第三级的来源，`data/README.md` §1.3.2）
          con=$(extract-oracle check data/fixtures/reserved.zip --target windows --module accessibility)
          for token in test_path_false get_content_error open_readable; do
            echo "$con" | grep -q "\"$token\"" || { echo "FAIL CON.txt: 缺证据 $token"; fail=1; }
          done
          # 反向一：`clean.zip` 三平台零异常（退 0）
          for target in windows macos linux; do
            extract-oracle check data/fixtures/clean.zip --target "$target" --module accessibility > /dev/null
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "FAIL clean.zip/$target: 期望退出码 0（无异常），实得 $rc"; fail=1
            fi
          done
          # 反向二：`long_comp.zip` 不得被判成 WRITTEN_TRUNCATED（M1 实测：创建即失败）
          longc=$(extract-oracle check data/fixtures/long_comp.zip --target windows --module accessibility)
          if echo "$longc" | grep -q "\"WRITTEN_TRUNCATED\": [1-9]"; then
            echo "FAIL long_comp.zip: 组件超长被判成截断（应为 BLOCKED）"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "accessibility smoke OK"
